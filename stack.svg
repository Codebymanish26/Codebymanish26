<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="Tech Stack">
  <title>Tech Stack</title>
  <desc>Left: Orbiting React-style tech atom with core tools. Right: Categorized technical skills grid.</desc>
  <defs>
    <style>
      .sg { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; }
      .sgm { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; }
      .jb { font-family: ui-monospace, Menlo, Consolas, monospace; }
      .jbb { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes rotateAtom {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .fu { animation: fadeUp .7s cubic-bezier(.2,.8,.2,1) both; }
      .core { transform-box: fill-box; transform-origin: center; animation: breathe 4s ease-in-out infinite; }
    </style>

    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171a2c"/>
      <stop offset="100%" stop-color="#121423"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#262a42"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.5"/>
    </linearGradient>

    <radialGradient id="coreG" cx=".35" cy=".3" r=".8">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>

    <pattern id="dots3" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.8" fill="#fff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="480" rx="24" fill="url(#cardbg)"/>
  <rect width="1280" height="480" rx="24" fill="url(#dots3)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="478.5" rx="23.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <!-- Header -->
  <g class="fu" style="animation-delay: 0.1s;">
    <text class="jbb" x="40" y="52" font-size="12.5" fill="#22d3ee" letter-spacing="2.2">// TECH STACK</text>
    <text class="sg" x="40" y="90" font-size="28" fill="#eceef6" letter-spacing="-0.5">Tools I build with</text>
  </g>

  <!-- Divider Line -->
  <line x1="500" y1="110" x2="500" y2="430" stroke="#262a42" stroke-width="1.2"/>

  <!-- LEFT: Tech Atom Visualization -->
  <g transform="translate(250, 270)">
    <!-- Orbital Rings -->
    <ellipse rx="180" ry="85" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1.5" transform="rotate(0)"/>
    <ellipse rx="180" ry="85" fill="none" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1.5" transform="rotate(60)"/>
    <ellipse rx="180" ry="85" fill="none" stroke="#f472b6" stroke-opacity="0.3" stroke-width="1.5" transform="rotate(120)"/>

    <!-- Center Nucleus Core -->
    <circle class="core" r="32" fill="url(#coreG)"/>
    <text class="jbb" x="0" y="5" font-size="12" fill="#ffffff" text-anchor="middle">MANISH</text>

    <!-- Node 1: React -->
    <g transform="translate(180, 0)">
      <circle r="18" fill="#0f172a" stroke="#61dafb" stroke-width="1.5"/>
      <text font-size="16" x="-8" y="6">⚛️</text>
    </g>

    <!-- Node 2: Node.js -->
    <g transform="translate(-180, 0)">
      <circle r="18" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
      <text font-size="16" x="-8" y="6">🟩</text>
    </g>

    <!-- Node 3: Python -->
    <g transform="translate(90, -145)">
      <circle r="18" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>
      <text font-size="16" x="-8" y="6">🐍</text>
    </g>

    <!-- Node 4: AI Gemini -->
    <g transform="translate(-90, 145)">
      <circle r="18" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
      <text font-size="16" x="-8" y="6">✨</text>
    </g>

    <!-- Node 5: Next.js -->
    <g transform="translate(-90, -145)">
      <circle r="18" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
      <text font-size="14" x="-7" y="5">▲</text>
    </g>

    <!-- Node 6: TypeScript -->
    <g transform="translate(90, 145)">
      <circle r="18" fill="#0f172a" stroke="#3178c6" stroke-width="1.5"/>
      <text class="jbb" x="0" y="4" font-size="12" fill="#3178c6" text-anchor="middle">TS</text>
    </g>
  </g>

  <!-- RIGHT: Classified Tech Grid -->
  <g transform="translate(540, 115)">
    <!-- Category 1: Frontend & Design -->
    <g transform="translate(0, 0)">
      <text class="jbb" x="0" y="20" font-size="14" fill="#38bdf8" letter-spacing="1">FRONTEND &amp; UI</text>

      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="105" height="34" rx="8" fill="#171e36" stroke="#253158"/>
        <text class="jb" x="52.5" y="21" font-size="12" fill="#f8fafc" text-anchor="middle">React.js</text>

        <rect x="115" y="0" width="105" height="34" rx="8" fill="#171e36" stroke="#253158"/>
        <text class="jb" x="167.5" y="21" font-size="12" fill="#f8fafc" text-anchor="middle">Next.js</text>

        <rect x="230" y="0" width="115" height="34" rx="8" fill="#171e36" stroke="#253158"/>
        <text class="jb" x="287.5" y="21" font-size="12" fill="#f8fafc" text-anchor="middle">TypeScript</text>

        <rect x="355" y="0" width="115" height="34" rx="8" fill="#171e36" stroke="#253158"/>
        <text class="jb" x="412.5" y="21" font-size="12" fill="#f8fafc" text-anchor="middle">JavaScript</text>

        <rect x="480" y="0" width="110" height="34" rx="8" fill="#171e36" stroke="#253158"/>
        <text class="jb" x="535" y="21" font-size="12" fill="#f8fafc" text-anchor="middle">Tailwind CSS</text>
      </g>
    </g>

    <!-- Category 2: Backend & Database -->
    <g transform="translate(0, 105)">
      <text class="jbb" x="0" y="20" font-size="14" fill="#a78bfa" letter-spacing="1">BACKEND &amp; DATABASE</text>

      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="105" height="34" rx="8" fill="#1e1838" stroke="#332a58"/>
        <text class="jb" x="52.5" y="21" font-size="12" fill="#f8fafc" text-anchor="middle">Node.js</text>

        <rect x="115" y="0" width="105" height="34" rx="8" fill="#1e1838" stroke="#332a58"/>
        <text class="jb" x="167.5" y="21" font-size="12" fill="#f8fafc" text-anchor="middle">Express</text>

        <rect x="230" y="0" width="105" height="34" rx="8" fill="#1e1838" stroke="#332a58"/>
        <text class="jb" x="282.5" y="21" font-size="12" fill="#f8fafc" text-anchor="middle">Python</text>

        <rect x="345" y="0" width="115" height="34" rx="8" fill="#1e1838" stroke="#332a58"/>
        <text class="jb" x="402.5" y="21" font-size="12" fill="#f8fafc" text-anchor="middle">MongoDB</text>

        <rect x="470" y="0" width="120" height="34" rx="8" fill="#1e1838" stroke="#332a58"/>
        <text class="jb" x="530" y="21" font-size="12" fill="#f8fafc" text-anchor="middle">PostgreSQL</text>
      </g>
    </g>

    <!-- Category 3: AI & Developer Ecosystem -->
    <g transform="translate(0, 210)">
      <text class="jbb" x="0" y="20" font-size="14" fill="#f472b6" letter-spacing="1">AI &amp; DEVELOPER TOOLS</text>

      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="115" height="34" rx="8" fill="#28172c" stroke="#4a2552"/>
        <text class="jb" x="57.5" y="21" font-size="12" fill="#f8fafc" text-anchor="middle">Gemini API</text>

        <rect x="125" y="0" width="110" height="34" rx="8" fill="#28172c" stroke="#4a2552"/>
        <text class="jb" x="180" y="21" font-size="12" fill="#f8fafc" text-anchor="middle">Git / GitHub</text>

        <rect x="245" y="0" width="95" height="34" rx="8" fill="#28172c" stroke="#4a2552"/>
        <text class="jb" x="292.5" y="21" font-size="12" fill="#f8fafc" text-anchor="middle">Docker</text>

        <rect x="350" y="0" width="105" height="34" rx="8" fill="#28172c" stroke="#4a2552"/>
        <text class="jb" x="402.5" y="21" font-size="12" fill="#f8fafc" text-anchor="middle">Firebase</text>

        <rect x="465" y="0" width="125" height="34" rx="8" fill="#28172c" stroke="#4a2552"/>
        <text class="jb" x="527.5" y="21" font-size="12" fill="#f8fafc" text-anchor="middle">VS Code &amp; Linux</text>
      </g>
    </g>
  </g>
</svg>

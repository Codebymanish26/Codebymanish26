<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 260" width="1280" height="260" role="img" aria-label="Let's Connect">
  <title>Let's Connect</title>
  <desc>Footer banner encouraging connection and collaboration with Manish.</desc>
  <defs>
    <style>
      .sg { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; }
      .sgm { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; }
      .jb { font-family: ui-monospace, Menlo, Consolas, monospace; }
      .jbb { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.9; }
      }

      .fu { animation: fadeUp 0.7s cubic-bezier(.2,.8,.2,1) both; }
      .glow { animation: pulseGlow 4s ease-in-out infinite; }
    </style>

    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171a2c"/>
      <stop offset="100%" stop-color="#121423"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="textG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <pattern id="dots5" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.8" fill="#fff" fill-opacity="0.05"/>
    </pattern>

    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <g class="fu">
    <!-- Card Outer -->
    <rect width="1280" height="260" rx="24" fill="url(#cardbg)"/>
    <rect width="1280" height="260" rx="24" fill="url(#dots5)"/>
    <rect x="0.75" y="0.75" width="1278.5" height="258.5" rx="23.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

    <!-- Ambient Glow Blobs -->
    <g filter="url(#blur40)" class="glow">
      <circle cx="200" cy="130" r="100" fill="#22d3ee" fill-opacity="0.15"/>
      <circle cx="1080" cy="130" r="100" fill="#f472b6" fill-opacity="0.15"/>
    </g>

    <!-- Center Content -->
    <g transform="translate(640, 130)" text-anchor="middle">
      <text class="jbb" y="-45" font-size="13" fill="#22d3ee" letter-spacing="3">// LET'S CONNECT</text>
      <text class="sg" y="10" font-size="38" fill="url(#textG)" letter-spacing="-0.5">Let's Build Something Great Together</text>
      <text class="sgm" y="55" font-size="16" fill="#cbd5e1" opacity="0.9">Open for web application builds, AI integration, and exciting technical collaborations.</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-label="Saurav Ghimire — Full-Stack &amp; AI Developer">
  <title>Saurav Ghimire — Full-Stack &amp; AI Developer</title>
  <desc>Hero banner with animated greeting, gradient name, cycling roles, and developer workstation preview.</desc>
  <defs>
    <style>
      @font-face {
        font-family: 'Inter';
        src: local('Segoe UI'), local('Arial'), sans-serif;
      }
      .sg { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; }
      .sgm { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; }
      .jb { font-family: ui-monospace, Menlo, Consolas, monospace; }
      .jbb { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.95); }
      }
      @keyframes drift {
        from { transform: translate(0, 0); }
        to { transform: translate(35px, -25px); }
      }
      @keyframes drift2 {
        from { transform: translate(0, 0); }
        to { transform: translate(-40px, 30px); }
      }
      @keyframes role {
        0% { opacity: 0; transform: translateY(18px); }
        4% { opacity: 1; transform: translateY(0); }
        22% { opacity: 1; transform: translateY(0); }
        25.5% { opacity: 0; transform: translateY(-18px); }
        100% { opacity: 0; transform: translateY(-18px); }
      }

      .fu { animation: fadeUp .8s cubic-bezier(.2,.8,.2,1) both; }
      .fi { animation: fadeIn .8s ease both; }
      .blob { animation: drift 14s ease-in-out infinite alternate; }
      .blob2 { animation: drift2 16s ease-in-out infinite alternate; }
      .role-box { animation: role 12s cubic-bezier(.2,.8,.2,1) infinite; }
      .code-window { animation: fadeUp 1s cubic-bezier(.2,.8,.2,1) 0.2s both; }
    </style>

    <linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-.3 0; .3 0; -.3 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.4"/>
    </linearGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>

    <filter id="blur60" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>

    <clipPath id="card">
      <rect width="1280" height="540" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- Dark Background -->
    <rect width="1280" height="540" fill="#0d0e16"/>
    <rect width="1280" height="540" fill="url(#dots)"/>

    <!-- Ambient Glowing Blobs -->
    <g filter="url(#blur60)" opacity="0.6">
      <circle class="blob" cx="180" cy="140" r="160" fill="#22d3ee" fill-opacity="0.25"/>
      <circle class="blob2" cx="490" cy="450" r="180" fill="#a78bfa" fill-opacity="0.22"/>
      <circle class="blob" cx="1120" cy="100" r="150" fill="#f472b6" fill-opacity="0.18"/>
    </g>

    <!-- Outer Frame Border -->
    <rect x="0.75" y="0.75" width="1278.5" height="538.5" rx="23.25" fill="none" stroke="url(#cardEdge)" stroke-width="1.5"/>

    <!-- LEFT SIDE: Greeting & Name & Cycling Roles -->
    <g transform="translate(70, 0)">
      <!-- Badge -->
      <g class="fu" style="animation-delay: 0.1s;">
        <rect x="0" y="105" width="200" height="32" rx="16" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.3"/>
        <circle cx="20" cy="121" r="4" fill="#22d3ee">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text class="jbb" x="34" y="125" font-size="11" fill="#22d3ee" letter-spacing="1.5">WELCOME TO MY REPO</text>
      </g>

      <!-- Main Name -->
      <g class="fu" style="animation-delay: 0.25s;">
        <text class="sg" x="0" y="195" font-size="22" fill="#94a3b8" letter-spacing="1">HI THERE 👋 I'M</text>
        <text class="sg" x="0" y="260" font-size="58" fill="url(#nameG)" letter-spacing="-1">SAURAV GHIMIRE</text>
      </g>

      <!-- Cycling Roles Box -->
      <g class="fu" style="animation-delay: 0.4s;" transform="translate(0, 285)">
        <!-- Role 1 -->
        <g class="role-box" style="animation-delay: 0s;">
          <text class="jbb" x="0" y="30" font-size="28" fill="#38bdf8">&gt; Full-Stack Developer 💻</text>
        </g>
        <!-- Role 2 -->
        <g class="role-box" style="animation-delay: 3s;">
          <text class="jbb" x="0" y="30" font-size="28" fill="#c084fc">&gt; AI &amp; Web Engineer 🚀</text>
        </g>
        <!-- Role 3 -->
        <g class="role-box" style="animation-delay: 6s;">
          <text class="jbb" x="0" y="30" font-size="28" fill="#f472b6">&gt; Creative Problem Solver 🧩</text>
        </g>
        <!-- Role 4 -->
        <g class="role-box" style="animation-delay: 9s;">
          <text class="jbb" x="0" y="30" font-size="28" fill="#34d399">&gt; Open Source Contributor 🌐</text>
        </g>
      </g>

      <!-- Subtitle & Quick Tech Chips -->
      <g class="fu" style="animation-delay: 0.55s;" transform="translate(0, 365)">
        <text class="sgm" x="0" y="0" font-size="16" fill="#cbd5e1" opacity="0.9">Dream Big · Work Hard · Stay Real ⚡</text>

        <!-- Chips -->
        <g transform="translate(0, 22)">
          <rect x="0" y="0" width="90" height="28" rx="8" fill="#1e293b" stroke="#334155"/>
          <text class="jb" x="45" y="18" font-size="12" fill="#38bdf8" text-anchor="middle">React.js</text>

          <rect x="100" y="0" width="90" height="28" rx="8" fill="#1e293b" stroke="#334155"/>
          <text class="jb" x="145" y="18" font-size="12" fill="#a855f7" text-anchor="middle">Next.js</text>

          <rect x="200" y="0" width="85" height="28" rx="8" fill="#1e293b" stroke="#334155"/>
          <text class="jb" x="242.5" y="18" font-size="12" fill="#f43f5e" text-anchor="middle">Node.js</text>

          <rect x="295" y="0" width="85" height="28" rx="8" fill="#1e293b" stroke="#334155"/>
          <text class="jb" x="337.5" y="18" font-size="12" fill="#eab308" text-anchor="middle">Python</text>

          <rect x="390" y="0" width="105" height="28" rx="8" fill="#1e293b" stroke="#334155"/>
          <text class="jb" x="442.5" y="18" font-size="12" fill="#10b981" text-anchor="middle">Gemini AI</text>
        </g>
      </g>
    </g>

    <!-- RIGHT SIDE: Developer Workstation / Interactive IDE Mockup -->
    <g class="code-window" transform="translate(680, 85)">
      <!-- Outer IDE Window Box -->
      <rect x="0" y="0" width="530" height="370" rx="16" fill="#121526" stroke="#262d4a" stroke-width="1.5"/>
      <rect x="0" y="0" width="530" height="36" rx="16" fill="#1a1e36"/>

      <!-- Window Controls -->
      <circle cx="22" cy="18" r="5.5" fill="#ff5f57"/>
      <circle cx="38" cy="18" r="5.5" fill="#febc2e"/>
      <circle cx="54" cy="18" r="5.5" fill="#28c840"/>

      <!-- Window Title -->
      <text class="jb" x="265" y="22" font-size="12" fill="#94a3b8" text-anchor="middle">saurav.config.ts — Visual Studio Code</text>

      <!-- Sidebar file icons mock -->
      <rect x="0" y="36" width="46" height="334" fill="#0d101f"/>
      <circle cx="23" cy="60" r="10" fill="#22d3ee" fill-opacity="0.2"/>
      <circle cx="23" cy="95" r="10" fill="#a78bfa" fill-opacity="0.15"/>
      <circle cx="23" cy="130" r="10" fill="#f472b6" fill-opacity="0.15"/>

      <!-- Code Editor Area -->
      <g transform="translate(65, 55)">
        <text class="jb" x="0" y="20" font-size="13" fill="#f472b6">const <tspan fill="#38bdf8">developer</tspan> = {</text>

        <text class="jb" x="20" y="48" font-size="13" fill="#cbd5e1">name: <tspan fill="#34d399">'Saurav Ghimire'</tspan>,</text>

        <text class="jb" x="20" y="76" font-size="13" fill="#cbd5e1">username: <tspan fill="#34d399">'Codebymanish26'</tspan>,</text>

        <text class="jb" x="20" y="104" font-size="13" fill="#cbd5e1">motto: <tspan fill="#34d399">'Not luck, hard work brings success'</tspan>,</text>

        <text class="jb" x="20" y="132" font-size="13" fill="#cbd5e1">coreStack: [</text>
        <text class="jb" x="40" y="158" font-size="12" fill="#f59e0b">'React'</text><text class="jb" x="100" y="158" font-size="12" fill="#cbd5e1">, </text>
        <text class="jb" x="115" y="158" font-size="12" fill="#f59e0b">'Next.js'</text><text class="jb" x="180" y="158" font-size="12" fill="#cbd5e1">, </text>
        <text class="jb" x="195" y="158" font-size="12" fill="#f59e0b">'TypeScript'</text><text class="jb" x="285" y="158" font-size="12" fill="#cbd5e1">, </text>
        <text class="jb" x="40" y="182" font-size="12" fill="#f59e0b">'Python'</text><text class="jb" x="105" y="182" font-size="12" fill="#cbd5e1">, </text>
        <text class="jb" x="120" y="182" font-size="12" fill="#f59e0b">'TailwindCSS'</text>
        <text class="jb" x="20" y="208" font-size="13" fill="#cbd5e1">],</text>

        <text class="jb" x="20" y="236" font-size="13" fill="#cbd5e1">status: <tspan fill="#38bdf8">'Dream Big · Work Hard · Stay Real'</tspan></text>

        <text class="jb" x="0" y="264" font-size="13" fill="#f472b6">};</text>

        <text class="jb" x="0" y="296" font-size="13" fill="#38bdf8">developer<tspan fill="#cbd5e1">.</tspan><tspan fill="#a78bfa">buildFuture</tspan><tspan fill="#cbd5e1">();</tspan></text>
        <rect x="180" y="284" width="8" height="15" fill="#38bdf8" class="pulse"/>
      </g>
    </g>
  </g>
</svg>

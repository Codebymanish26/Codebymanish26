<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Developer and Life Beyond Code">
  <title>Developer and Life Beyond Code</title>
  <desc>Left: Developer mindset &amp; engineering principles. Right: Hobbies, passion projects, and life outside code.</desc>
  <defs>
    <style>
      .sg { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; }
      .sgm { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; }
      .jb { font-family: ui-monospace, Menlo, Consolas, monospace; }
      .jbb { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(30px); }
        to { opacity: 1; transform: translateX(0); }
      }

      .cardL { animation: fadeUp .8s cubic-bezier(.2,.8,.2,1) .1s both; }
      .cardR { animation: fadeUp .8s cubic-bezier(.2,.8,.2,1) .3s both; }
      .cursor { animation: pulse 1s steps(1) infinite; }
    </style>

    <linearGradient id="edgeL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#262a42"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="edgeR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#262a42"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171a2c"/>
      <stop offset="100%" stop-color="#121423"/>
    </linearGradient>

    <pattern id="dots2" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="0.8" fill="#fff" fill-opacity="0.05"/>
    </pattern>

    <clipPath id="winL">
      <rect x="35" y="125" width="550" height="475" rx="14"/>
    </clipPath>
    <clipPath id="winR">
      <rect x="695" y="125" width="550" height="475" rx="14"/>
    </clipPath>
  </defs>

  <!-- LEFT CARD: Developer Mindset -->
  <g class="cardL">
    <rect x="0" y="0" width="620" height="640" rx="24" fill="url(#cardbg)"/>
    <rect x="0" y="0" width="620" height="640" rx="24" fill="url(#dots2)"/>
    <rect x="0.75" y="0.75" width="618.5" height="638.5" rx="23.25" fill="none" stroke="url(#edgeL)" stroke-width="1.5"/>

    <text class="jbb" x="35" y="46" font-size="12.5" fill="#22d3ee" letter-spacing="2.2">// DEVELOPER MINDSET</text>
    <text class="sg" x="35" y="86" font-size="28" fill="#eceef6" letter-spacing="-0.5">Crafting code with impact</text>

    <!-- Browser Window Mockup -->
    <g clip-path="url(#winL)">
      <rect x="35" y="125" width="550" height="475" fill="#0f1224"/>
      <rect x="35" y="125" width="550" height="36" fill="#1b2038"/>

      <!-- Window Dots -->
      <circle cx="55" cy="143" r="5" fill="#ff5f57"/>
      <circle cx="71" cy="143" r="5" fill="#febc2e"/>
      <circle cx="87" cy="143" r="5" fill="#28c840"/>

      <!-- URL bar -->
      <rect x="180" y="133" width="260" height="20" rx="10" fill="#0b0e1b"/>
      <text class="jb" x="310" y="147" font-size="11" fill="#8d93ab" text-anchor="middle">localhost:5173/manish/profile</text>
      <rect class="cursor" x="382" y="137" width="1.5" height="12" fill="#22d3ee"/>

      <!-- Inner Content -->
      <g transform="translate(60, 185)">
        <!-- Value 1 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="40" height="40" rx="10" fill="#22d3ee" fill-opacity="0.15"/>
          <text font-size="20" x="10" y="27">⚡</text>
          <text class="sg" x="55" y="20" font-size="16" fill="#f8fafc">Performance-First Engineering</text>
          <text class="sgm" x="55" y="38" font-size="13" fill="#94a3b8">Optimized render loops, responsive layout &amp; fast APIs</text>
        </g>

        <!-- Value 2 -->
        <g transform="translate(0, 65)">
          <rect x="0" y="0" width="40" height="40" rx="10" fill="#a78bfa" fill-opacity="0.15"/>
          <text font-size="20" x="10" y="27">🤖</text>
          <text class="sg" x="55" y="20" font-size="16" fill="#f8fafc">AI &amp; Smart System Integration</text>
          <text class="sgm" x="55" y="38" font-size="13" fill="#94a3b8">Infusing LLMs &amp; intelligent tools into web products</text>
        </g>

        <!-- Value 3 -->
        <g transform="translate(0, 130)">
          <rect x="0" y="0" width="40" height="40" rx="10" fill="#f472b6" fill-opacity="0.15"/>
          <text font-size="20" x="10" y="27">🎨</text>
          <text class="sg" x="55" y="20" font-size="16" fill="#f8fafc">Modern UI / UX Architecture</text>
          <text class="sgm" x="55" y="38" font-size="13" fill="#94a3b8">Smooth GSAP animations, clean layouts &amp; accessible UI</text>
        </g>

        <!-- Value 4 -->
        <g transform="translate(0, 195)">
          <rect x="0" y="0" width="40" height="40" rx="10" fill="#34d399" fill-opacity="0.15"/>
          <text font-size="20" x="10" y="27">🛡️</text>
          <text class="sg" x="55" y="20" font-size="16" fill="#f8fafc">Clean Code &amp; Scalable Stack</text>
          <text class="sgm" x="55" y="38" font-size="13" fill="#94a3b8">Modular architecture, robust types &amp; clean testing</text>
        </g>

        <!-- Status box -->
        <g transform="translate(0, 275)">
          <rect x="0" y="0" width="500" height="60" rx="12" fill="#171b33" stroke="#2a3158"/>
          <text class="jbb" x="20" y="25" font-size="12" fill="#38bdf8">&gt; STATUS: Currently exploring advanced agentic workflows</text>
          <text class="jb" x="20" y="45" font-size="11" fill="#94a3b8">Building full-stack AI-driven web applications</text>
        </g>
      </g>
    </g>
  </g>

  <!-- RIGHT CARD: Life Beyond Code -->
  <g class="cardR" transform="translate(660, 0)">
    <rect x="0" y="0" width="620" height="640" rx="24" fill="url(#cardbg)"/>
    <rect x="0" y="0" width="620" height="640" rx="24" fill="url(#dots2)"/>
    <rect x="0.75" y="0.75" width="618.5" height="638.5" rx="23.25" fill="none" stroke="url(#edgeR)" stroke-width="1.5"/>

    <text class="jbb" x="35" y="46" font-size="12.5" fill="#f472b6" letter-spacing="2.2">// BEYOND THE TERMINAL</text>
    <text class="sg" x="35" y="86" font-size="28" fill="#eceef6" letter-spacing="-0.5">What fuels my curiosity</text>

    <!-- Grid of Hobbies & Interests -->
    <g transform="translate(35, 125)">
      <!-- Item 1: AI & Tech Research -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="265" height="225" rx="16" fill="#161b2e" stroke="#252c48" stroke-width="1.2"/>
        <circle cx="45" cy="45" r="22" fill="#38bdf8" fill-opacity="0.2"/>
        <text font-size="22" x="34" y="52">🧠</text>
        <text class="sg" x="25" y="105" font-size="18" fill="#f8fafc">AI &amp; Tech Research</text>
        <text class="sgm" x="25" y="135" font-size="13" fill="#94a3b8">Exploring generative AI, prompt engineering, and agent systems.</text>
        <rect x="25" y="175" width="80" height="24" rx="6" fill="#0f172a"/>
        <text class="jb" x="65" y="191" font-size="11" fill="#38bdf8" text-anchor="middle">Innovate</text>
      </g>

      <!-- Item 2: Open Source -->
      <g transform="translate(285, 0)">
        <rect x="0" y="0" width="265" height="225" rx="16" fill="#161b2e" stroke="#252c48" stroke-width="1.2"/>
        <circle cx="45" cy="45" r="22" fill="#a78bfa" fill-opacity="0.2"/>
        <text font-size="22" x="34" y="52">🌐</text>
        <text class="sg" x="25" y="105" font-size="18" fill="#f8fafc">Open Source</text>
        <text class="sgm" x="25" y="135" font-size="13" fill="#94a3b8">Contributing to community projects and building developer tools.</text>
        <rect x="25" y="175" width="90" height="24" rx="6" fill="#0f172a"/>
        <text class="jb" x="70" y="191" font-size="11" fill="#a78bfa" text-anchor="middle">Community</text>
      </g>

      <!-- Item 3: System Design & Algorithms -->
      <g transform="translate(0, 245)">
        <rect x="0" y="0" width="265" height="225" rx="16" fill="#161b2e" stroke="#252c48" stroke-width="1.2"/>
        <circle cx="45" cy="45" r="22" fill="#f472b6" fill-opacity="0.2"/>
        <text font-size="22" x="34" y="52">🚀</text>
        <text class="sg" x="25" y="105" font-size="18" fill="#f8fafc">Problem Solving</text>
        <text class="sgm" x="25" y="135" font-size="13" fill="#94a3b8">Tackling algorithmic challenges, logic puzzles, and architecture.</text>
        <rect x="25" y="175" width="90" height="24" rx="6" fill="#0f172a"/>
        <text class="jb" x="70" y="191" font-size="11" fill="#f472b6" text-anchor="middle">Algorithms</text>
      </g>

      <!-- Item 4: Continuous Learning -->
      <g transform="translate(285, 245)">
        <rect x="0" y="0" width="265" height="225" rx="16" fill="#161b2e" stroke="#252c48" stroke-width="1.2"/>
        <circle cx="45" cy="45" r="22" fill="#34d399" fill-opacity="0.2"/>
        <text font-size="22" x="34" y="52">📚</text>
        <text class="sg" x="25" y="105" font-size="18" fill="#f8fafc">Continuous Growth</text>
        <text class="sgm" x="25" y="135" font-size="13" fill="#94a3b8">Learning new frameworks, reading tech blogs, and experimenting.</text>
        <rect x="25" y="175" width="80" height="24" rx="6" fill="#0f172a"/>
        <text class="jb" x="65" y="191" font-size="11" fill="#34d399" text-anchor="middle">Evolution</text>
      </g>
    </g>
  </g>
</svg>

<svg width="854" height="230" viewBox="0 0 854 230" xmlns="http://www.w3.org/2000/svg" style="z-index:1;position:relative">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="50%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .name-title {
      font-size: 52px;
      font-weight: 800;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .role-desc {
      font-size: 20px;
      font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      fill: #e0e7ff;
      letter-spacing: 0.5px;
    }
    .wave-anim-1 {
      animation: wave1 18s ease-in-out infinite alternate;
    }
    .wave-anim-2 {
      animation: wave2 14s ease-in-out infinite alternate;
    }
  </style>

  <!-- Waving Animated Background Paths -->
  <g transform="translate(427, 115) scale(1, 1) translate(-427, -115)">
    <!-- Base Wave Layer -->
    <path fill="url(#headerGrad)" opacity="0.35">
      <animate attributeName="d" dur="18s" repeatCount="indefinite"
        values="M0 0 L0 150 Q213.5 190 427 160 T854 185 L854 0 Z;
                M0 0 L0 175 Q213.5 190 427 170 T854 160 L854 0 Z;
                M0 0 L0 195 Q213.5 165 427 195 T854 160 L854 0 Z;
                M0 0 L0 150 Q213.5 190 427 160 T854 185 L854 0 Z" />
    </path>
    <!-- Secondary Wave Layer -->
    <path fill="url(#headerGrad2)" opacity="0.45">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M0 0 L0 165 Q213.5 210 427 180 T854 190 L854 0 Z;
                M0 0 L0 180 Q213.5 150 427 150 T854 170 L854 0 Z;
                M0 0 L0 175 Q213.5 155 427 180 T854 195 L854 0 Z;
                M0 0 L0 165 Q213.5 210 427 180 T854 190 L854 0 Z" />
    </path>
    <!-- Primary Foreground Wave Layer -->
    <path fill="url(#headerGrad)" opacity="0.95">
      <animate attributeName="d" dur="16s" repeatCount="indefinite"
        values="M0 0 L0 140 Q213.5 175 427 145 T854 170 L854 0 Z;
                M0 0 L0 160 Q213.5 145 427 165 T854 150 L854 0 Z;
                M0 0 L0 150 Q213.5 180 427 155 T854 165 L854 0 Z;
                M0 0 L0 140 Q213.5 175 427 145 T854 170 L854 0 Z" />
    </path>
  </g>

  <!-- Title & Description Text -->
  <text text-anchor="middle" dominant-baseline="middle" x="50%" y="36%" class="name-title">Saurav Ghimire</text>
  <text text-anchor="middle" dominant-baseline="middle" x="50%" y="58%" class="role-desc">Senior Software Engineer | AI &amp; Full Stack Architect</text>
</svg>
